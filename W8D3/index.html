<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Catatan Kegiatan Santri</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <h1>Catatan Kegiatan Santri</h1>

      <form id="form-kegiatan">
        <input
          type="text"
          id="input-kegiatan"
          placeholder="Contoh: Setoran Hafalan Juz 30"
          autocomplete="off"
        />
        <button type="submit">Tambah</button>
      </form>

      <ul id="daftar-kegiatan"></ul>
    </div>

    <script src="script.js"></script>
  </body>
</html>
